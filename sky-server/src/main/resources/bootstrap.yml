spring:
  application:
    name: sky-server
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
      config:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos
        file-extension: yaml

# Seata 分布式事务配置
# 使用 grouplist 直连模式（避免 Docker 容器 IP 不可达问题）
# tx-service-group 与 seata-server 的 vgroup-mapping 一致
seata:
  enabled: true
  tx-service-group: sky-server-group
  service:
    vgroup-mapping:
      sky-server-group: default
    grouplist:
      default: 127.0.0.1:8091
