server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: sky-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      server:
        webflux:
          routes:
            - id: sky-admin-ws-route
              uri: lb:ws://sky-admin-service
              predicates:
                - Path=/ws/**
            - id: sky-admin-route
              uri: lb://sky-admin-service
              predicates:
                - Path=/admin/employee/**
            - id: sky-user-route
              uri: lb://sky-user-service
              predicates:
                - Path=/user/user/**,/user/addressBook/**
            - id: sky-menu-route
              uri: lb://sky-menu-service
              predicates:
                - Path=/admin/category/**,/admin/dish/**,/admin/setmeal/**,/admin/common/**,/user/category/**,/user/dish/**,/user/setmeal/**
            - id: sky-cart-route
              uri: lb://sky-cart-service
              predicates:
                - Path=/user/shoppingCart/**
            - id: sky-order-route
              uri: lb://sky-order-service
              predicates:
                - Path=/admin/order/**,/admin/report/**,/admin/workspace/**,/admin/shop/**,/user/order/**,/user/shop/**,/notify/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8720
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-gateway-flow-rules.json
            groupId: DEFAULT_GROUP
            rule-type: gw-flow

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ============================================================
# JWT 认证配置 (Phase 7: Gateway 统一校验)
# 与各微服务 Nacos 配置中的 sky.jwt.* 保持一致
# ============================================================
sky:
  jwt:
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:itcast}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET:itbast}
    user-ttl: 7200000
    user-token-name: authentication

logging:
  level:
    com.sky.gateway.filter: DEBUG
    com.alibaba.cloud.sentinel.endpoint: WARN
