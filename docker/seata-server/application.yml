# ============================================================
# Seata Server 2.5.x 配置文件
# 挂载到容器内 /seata-server/resources/application.yml
# ============================================================

server:
  port: 8091

spring:
  application:
    name: seata-server
  main:
    web-application-type: none

logging:
  config: classpath:logback-spring.xml
  file:
    path: ${log.home:${user.home}/logs/seata}

seata:
  config:
    # 使用 file 类型：store.mode 从本地 application.yml 读取
    # registry 仍用 nacos，方便客户端发现 Seata Server
    type: file
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: nacos:8848
      namespace: ""
      group: SEATA_GROUP
      # Nacos 认证已开启，注册自身需带凭据（占位符默认值即真实值，可由容器环境变量覆盖）
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:SkyNacos@2026}
  store:
    mode: db
    db:
      datasource: druid
      db-type: mysql
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://host.docker.internal:3306/seata?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
      user: root
      password: 123456

  server:
    service-port: 8091

  # Seata 控制台认证 (http://localhost:8091)
  console:
    user:
      username: seata
      password: seata
