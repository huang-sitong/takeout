# Nacos 配置模板 —— 请在 Nacos 控制台中导入
# 访问：http://127.0.0.1:8848/nacos
# 命名空间：public (默认)
# Data ID: sky-server-dev.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# ============================================================
# 导入说明：
#   本文件为 Sentinel 接入 (TODO #2.3) 后的 sky-server-dev.yaml 模板。
#   本仓库中的 docs/ 仅作配置参照，敏感字段已用占位符 <...> 替换。
#   请将占位符替换为你的真实值后，在 Nacos 控制台「配置管理 - 配置列表」中，
#   找到 Data ID = sky-server-dev.yaml 的配置，点击「编辑」，
#   将下方内容（保留本说明头部也可，纯注释不影响 YAML 解析）
#   完整粘贴到「配置内容」输入框，保存。
#
# 注意：
#   - 本文件中的中文 (如 shop.address) 必须以 UTF-8 保存与粘贴，
#     Nacos 控制台默认按 UTF-8 解析，直接复制粘贴即可。
#   - spring.cloud.sentinel.transport.dashboard 指向 Sentinel Dashboard。
#   - spring.cloud.sentinel.datasource.flow/degrade 通过 Nacos 数据源持久化规则，
#     对应的规则 dataId 见同目录下：
#       docs/nacos-config-sky-server-flow-rules.json
#       docs/nacos-config-sky-server-degrade-rules.json
#     这两个 dataId 也需在 Nacos 中创建，否则启动时会告警 (不影响应用启动)。
# ============================================================

spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/sky_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: <your-mysql-username>
      password: <your-mysql-password>
  redis:
    host: localhost
    port: 6379
    password: <your-redis-password>
    database: 0
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: 127.0.0.1:8848
            username: nacos
            password: nacos
            dataId: sky-server-flow-rules.json
            groupId: DEFAULT_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: 127.0.0.1:8848
            username: nacos
            password: nacos
            dataId: sky-server-degrade-rules.json
            groupId: DEFAULT_GROUP
            rule-type: degrade

# ============================================================
# Seata 分布式事务配置 (#3 期)
# ============================================================
# 注意：seata.registry 和 seata.config 已在 bootstrap.yml 中配置，
# 以下为可选覆盖项。tx-service-group 必须与 seata-server 的 vgroup-mapping 一致。
# seata:
#   tx-service-group: sky-server-group
#   service:
#     vgroup-mapping:
#       sky-server-group: default

# ============================================================
# RocketMQ 消息队列配置 (#4 期)
# ============================================================
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: sky-server-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

sky:
  jwt:
    admin-secret-key: <your-jwt-admin-secret-key>
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: <your-jwt-user-secret-key>
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: <your-ali-oss-endpoint>
    access-key-id: <your-ali-oss-access-key-id>
    access-key-secret: <your-ali-oss-access-key-secret>
    bucket-name: <your-ali-oss-bucket-name>
  wechat:
    appid: <your-wechat-appid>
    secret: <your-wechat-secret>
  shop:
    address: <your-shop-address>
  baidu:
    ak: <your-baidu-ak>