# Nacos 配置模板 —— Docker 容器化部署
# 请在 Nacos 控制台中导入
# 访问：http://127.0.0.1:8848/nacos
# 命名空间：public (默认)
# Data ID: sky-server-docker.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# ============================================================
# 导入说明：
#   本文件为 Docker 容器化部署专用配置模板，所有中间件地址使用
#   Docker Compose 服务名（如 nacos, redis, seata, namesrv）。
#   本地开发请使用 sky-server-dev.yaml（地址为 127.0.0.1）。
#   敏感字段已用占位符 <...> 替换，请替换为你的真实值后，
#   在 Nacos 控制台「配置管理 - 配置列表」中新建或编辑配置，
#   将下方内容完整粘贴到「配置内容」输入框，保存。
#
# 与 sky-server-dev.yaml 的关键差异：
#   - MySQL: localhost → host.docker.internal（容器访问宿主机 MySQL）
#   - Redis: localhost → redis
#   - Nacos: 127.0.0.1 → nacos
#   - Sentinel Dashboard: localhost → sentinel
#   - RocketMQ NameServer: 127.0.0.1 → namesrv
#
# 注意：
#   - 本文件中的中文 (如 shop.address) 必须以 UTF-8 保存与粘贴，
#     Nacos 控制台默认按 UTF-8 解析，直接复制粘贴即可。
#   - Docker 部署时 sky-server 需设置环境变量 SPRING_PROFILES_ACTIVE=docker，
#     以激活 bootstrap-docker.yml 并从 Nacos 拉取本配置。
# ============================================================

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://host.docker.internal:3306/sky_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: <your-mysql-username>
      password: <your-mysql-password>
  redis:
    host: redis
    port: 6379
    password: <your-redis-password>
    database: 0
  cloud:
    sentinel:
      transport:
        dashboard: sentinel:8858
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: nacos:8848
            username: nacos
            password: nacos
            dataId: sky-server-flow-rules.json
            groupId: DEFAULT_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: nacos:8848
            username: nacos
            password: nacos
            dataId: sky-server-degrade-rules.json
            groupId: DEFAULT_GROUP
            rule-type: degrade

rocketmq:
  name-server: namesrv:9876
  producer:
    group: sky-server-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

sky:
  jwt:
    admin-secret-key: <your-jwt-admin-secret-key>
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: <your-jwt-user-secret-key>
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: <your-ali-oss-endpoint>
    access-key-id: <your-ali-oss-access-key-id>
    access-key-secret: <your-ali-oss-access-key-secret>
    bucket-name: <your-ali-oss-bucket-name>
  wechat:
    appid: <your-wechat-appid>
    secret: <your-wechat-secret>
  shop:
    address: <your-shop-address>
  baidu:
    ak: <your-baidu-ak>
