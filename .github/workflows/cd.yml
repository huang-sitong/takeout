# ============================================================
# CD — 构建镜像推 GHCR + SSH 部署（打 tag v* 或手动触发）
# ============================================================
# 流程：
#   1. mvn package 打出各服务 JAR
#   2. docker compose build 出 8 个服务 + sentinel 镜像，
#      镜像名带 ghcr.io/<owner>/<repo>/ 前缀（由 compose 的
#      REGISTRY_PREFIX 变量注入），推送到 GHCR
#   3. SCP 最新的 docker-compose.yml 到服务器，SSH 执行
#      docker compose pull && up -d 完成滚动更新
#
# 所需 Repo Secrets（Settings → Secrets and variables → Actions）：
#   DEPLOY_HOST      目标服务器 IP/域名
#   DEPLOY_USER      SSH 用户名
#   DEPLOY_SSH_KEY   SSH 私钥（cat ~/.ssh/id_ed25519 全文）
#
# 服务器侧一次性准备：
#   mkdir -p /opt/takeout
#   # .env 放真实凭据 + REGISTRY_PREFIX=ghcr.io/<owner>/<repo>/
#   # 若 GHCR 包是私有，需 docker login ghcr.io（PAT 带 read:packages）
# ============================================================
name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  # 参与镜像发布的服务（infra 类 redis/nacos/seata/mq 由服务器自行管理）
  # 注意：sentinel 是 compose 服务名，其镜像名是 sky-sentinel-dashboard
  SERVICES: sky-admin-service sky-user-service sky-menu-service sky-cart-service sky-order-service sky-agent-service sky-gateway sentinel

jobs:
  build-push:
    name: Build & Push images
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 各服务 Dockerfile 是 COPY target/*.jar 的形式，必须先打 JAR
      - name: Package all modules
        run: mvn -B -ntp package -DskipTests

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # compose 服务声明了 env_file: .env，加载模型时要求文件存在；
      # CI 只打镜像不跑容器，空文件即可，真实凭据在部署服务器的 .env
      - name: Create placeholder .env
        run: touch .env

      # 通过 compose 的变量注入镜像前缀与版本 tag，
      # 本地开发不受影响（两变量缺省时行为不变）
      - name: Build images
        run: docker compose build $SERVICES
        env:
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}/
          IMAGE_TAG: ${{ steps.ver.outputs.version }}

      - name: Push images
        run: docker compose push $SERVICES
        env:
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}/
          IMAGE_TAG: ${{ steps.ver.outputs.version }}

  deploy:
    name: Deploy to server
    needs: build-push
    # 暂禁部署：尚无部署服务器/未配 DEPLOY_* secrets。
    # 启用方法：删除下面这行 if，并在仓库 Secrets 配置
    #   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
    # 服务器侧准备见 README 或对话记录（.env + REGISTRY_PREFIX + docker login ghcr.io）
    if: false
    runs-on: ubuntu-latest
    # 可选：在 Settings → Environments 给 production 配置审核人/仅限保护分支
    environment: production
    env:
      DEPLOY_PATH: /opt/takeout
    steps:
      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}/
          overwrite: true

      - name: Pull & restart services
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}
            export IMAGE_TAG=${{ needs.build-push.outputs.version }}
            echo "Deploying version: $IMAGE_TAG"
            docker compose pull ${{ env.SERVICES }}
            docker compose up -d --no-build
            docker image prune -f
            docker compose ps
