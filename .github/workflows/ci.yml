# ============================================================
# CI — 编译打包校验（任意分支 push / PR 触发）
# ============================================================
# 注意：仅监听 main / develop / feature/* / release/* 分支；
# 其他分支（如 springAI）的 push 不会触发，需要时手动跑或加分支名。
# ============================================================
# 构建期不依赖 Nacos/MySQL/Redis（配置全部运行时从 Nacos 拉取），
# 所以 Runner 上无需起任何基础设施。
# 仓库当前无测试代码（test 目录被 gitignore），先 -DskipTests；
# 后续补充单元测试后去掉该参数即可。
# ============================================================
name: CI

on:
  push:
    branches:
      - main
      - develop
      - feature/*
      - release/*
  pull_request:
    branches:
      - main
      - develop
      - feature/*
      - release/*
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目已升级 JDK 21（虚拟线程优化）；Runner 是 Linux，无 Windows GBK 编码问题
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package all modules
        run: mvn -B -ntp package -DskipTests

      - name: Upload service JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars-${{ github.sha }}
          path: sky-*/target/*.jar
          retention-days: 3
          if-no-files-found: error
