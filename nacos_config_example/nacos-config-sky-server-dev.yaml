# Nacos 配置模板 —— 本地开发
# 请在 Nacos 控制台中导入
# 控制台：http://localhost:8849/index.html （Nacos 3.x 独立端口；旧 :8848/nacos/ 已废弃）
# 登录：nacos / <你的 Nacos 密码>（Nacos 3.x 已开启认证，首次需初始化管理员）
# 命名空间：public (默认)
# Data ID: sky-server-dev.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# ============================================================
# 说明：
#   - 本文件为本地开发配置，中间件地址为 127.0.0.1 / localhost。
#     Docker 部署请用 sky-server-docker.yaml（地址为容器服务名）。
#   - 敏感字段统一用 ${ENV_VAR:默认值} 占位符：真实密钥只存于 gitignored 的 .env，
#     因此本文件可安全提交，无需再做 <...> 手工屏蔽。
#     本地 dev 不自动加载 .env，运行前需 `set -a; source .env; set +a` 注入环境变量；
#     未注入时占位符退回冒号后的默认值（本地 DB/Redis 用 123456，密钥退回 PLACEHOLDER）。
#   - Spring Boot 3.x 的 Redis 配置键为 spring.data.redis.*（非 2.x 的 spring.redis.*，旧键会被静默忽略）。
#   - 中文（如 shop.address）以 UTF-8 保存粘贴。
#   - spring.cloud.sentinel.datasource.flow/degrade 依赖两份规则 dataId
#     （sky-server-flow-rules.json / sky-server-degrade-rules.json），需一并导入 Nacos，
#     否则启动告警（不影响应用启动）。
# ============================================================

spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/sky_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: ${SKY_DB_PASSWORD:123456}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SKY_REDIS_PASSWORD:123456}
      database: 0
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-server-flow-rules.json
            groupId: DEFAULT_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-server-degrade-rules.json
            groupId: DEFAULT_GROUP
            rule-type: degrade

# ============================================================
# Seata 分布式事务配置 (#3 期)
# ============================================================
# 注意：seata.enabled / tx-service-group / vgroup-mapping 已在 application.yml 中配置
# （原 bootstrap.yml 已随 Boot 3.x 升级移除，改用 spring.config.import 从 Nacos 拉配置）。
# 以下为可选覆盖项，tx-service-group 必须与 seata-server 的 vgroup-mapping 一致。
# seata:
#   tx-service-group: sky-server-group
#   service:
#     vgroup-mapping:
#       sky-server-group: default

# ============================================================
# RocketMQ 消息队列配置 (#4 期)
# ============================================================
rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: sky-server-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

sky:
  jwt:
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:itcast}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET:itbast}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${SKY_ALIOSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    access-key-id: ${SKY_ALIOSS_AK:PLACEHOLDER}
    access-key-secret: ${SKY_ALIOSS_SK:PLACEHOLDER}
    bucket-name: ${SKY_ALIOSS_BUCKET:nouxiaxia-sky-takeout}
  wechat:
    appid: ${SKY_WECHAT_APPID:wx6d0f01e4406a6a97}
    secret: ${SKY_WECHAT_SECRET:PLACEHOLDER}
  shop:
    address: ${SKY_SHOP_ADDRESS:桂林市灵川县灵田镇桂林电子科技大学花江校区}
  baidu:
    ak: ${SKY_BAIDU_AK:PLACEHOLDER}
