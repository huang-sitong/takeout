# Nacos 配置模板 —— sky-order-service（Docker 部署）
# Data ID: sky-order-service-docker.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# sky-order-service (:8086) — 订单核心 + 报表 + 工作台 + 店铺管理
# 数据库: sky_order_db  表: orders, order_detail, undo_log
# 依赖: 所有其他服务（通过 OpenFeign）
# 中间件: Redis + RocketMQ + Seata + 微信支付

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/sky_order_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SKY_DB_PASSWORD:123456}
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
  data:
    redis:
      host: redis
      port: 6379
      password: ${SKY_REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    sentinel:
      transport:
        dashboard: sentinel:8858
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-order-service-flow-rules.json
            groupId: DEFAULT_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-order-service-degrade-rules.json
            groupId: DEFAULT_GROUP
            rule-type: degrade

# RocketMQ 消息队列
rocketmq:
  name-server: namesrv:9876
  producer:
    group: sky-order-service-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2
  consumer:
    group: order-creation-consumer-group
    consume-thread-min: 5
    consume-thread-max: 20
    pull-batch-size: 32
    max-reconsume-times: 3

# Seata 分布式事务
seata:
  enabled: true
  tx-service-group: sky-order-service-group
  service:
    vgroup-mapping:
      sky-order-service-group: default
    grouplist:
      default: seata:8091

sky:
  wechat:
    appid: ${SKY_WECHAT_APPID:wx6d0f01e4406a6a97}
    secret: ${SKY_WECHAT_SECRET:PLACEHOLDER}
  shop:
    address: ${SKY_SHOP_ADDRESS:桂林市灵川县灵田镇桂林电子科技大学花江校区}
  baidu:
    ak: ${SKY_BAIDU_AK:PLACEHOLDER}

logging:
  level:
    com.alibaba.cloud.sentinel.endpoint: WARN
