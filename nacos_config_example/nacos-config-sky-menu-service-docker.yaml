# Nacos 配置模板 —— sky-menu-service（Docker 部署）
# Data ID: sky-menu-service-docker.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# sky-menu-service (:8084) — 菜品 / 套餐 / 分类管理 + OSS 上传
# 数据库: sky_menu_db  表: category, dish, dish_flavor, setmeal, setmeal_dish
# Redis: 菜品/套餐缓存    OSS: 图片上传

# 性能优化：调大 Tomcat 线程池/连接参数（实测：默认200线程高并发吞吐下降明显，400线程 80并发提升约2.5倍）
server:
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500
    max-connections: 10000
    connection-timeout: 5000

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/sky_menu_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SKY_DB_PASSWORD:123456}
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
  data:
    redis:
      host: redis
      port: 6379
      password: ${SKY_REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    sentinel:
      transport:
        dashboard: sentinel:8858
        port: 8719
      eager: true

sky:
  alioss:
    endpoint: ${SKY_ALIOSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    access-key-id: ${SKY_ALIOSS_AK:PLACEHOLDER}
    access-key-secret: ${SKY_ALIOSS_SK:PLACEHOLDER}
    bucket-name: ${SKY_ALIOSS_BUCKET:nouxiaxia-sky-takeout}

logging:
  level:
    com.alibaba.cloud.sentinel.endpoint: WARN
