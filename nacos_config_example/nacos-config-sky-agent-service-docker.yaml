# Nacos 配置模板 —— sky-agent-service（Docker 部署）
# Data ID: sky-agent-service-docker.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# sky-agent-service (:8087) — AI 智能助手（Spring AI / OpenAI 兼容接口）
# 无数据库；业务数据 Phase B 起经 OpenFeign 从各服务获取
# Phase C 起用 Redis 存多轮会话记忆

# 性能优化：调大 Tomcat 线程池/连接参数（实测：默认200线程高并发吞吐下降明显，400线程 80并发提升约2.5倍）
server:
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500
    max-connections: 10000
    connection-timeout: 5000

spring:
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: redis
      port: 6379
      password: ${SKY_REDIS_PASSWORD:123456}
      database: 0
  cloud:
    sentinel:
      transport:
        dashboard: sentinel:8858
        port: 8723
      eager: true
      # LLM 接口成本高：资源级流控规则持久化在 Nacos（agentChat/agentChatStream 各 5 QPS）
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-agent-service-flow-rules.json
            groupId: DEFAULT_GROUP
            rule-type: flow

# Spring AI (OpenAI 兼容接口) — API_KEY 由容器环境变量注入 (compose env_file: .env)
  ai:
    openai:
      base-url: ${BASE_URL:https://opencode.ai/zen/go/v1}
      api-key: ${API_KEY:}
      chat:
        # base-url 已含 /v1，需覆盖 Spring AI 默认路径 /v1/chat/completions，否则拼成 /v1/v1/... → 404
        completions-path: /chat/completions
        options:
          model: deepseek-v4-flash
          temperature: 0.7

logging:
  level:
    com.alibaba.cloud.sentinel.endpoint: WARN
    org.springframework.ai: info
