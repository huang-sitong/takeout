# Nacos 配置模板 —— Docker 容器化部署
# 请在 Nacos 控制台中导入
# 控制台：http://localhost:8849/index.html （Nacos 3.x 独立端口；旧 :8848/nacos/ 已废弃）
# 登录：nacos / <你的 Nacos 密码>（Nacos 3.x 已开启认证，首次需初始化管理员）
# 命名空间：public (默认)
# Data ID: sky-server-docker.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# ============================================================
# 说明：
#   - 本文件为 Docker 容器化部署专用配置，所有中间件地址使用
#     Docker Compose 服务名（nacos / redis / seata / namesrv 等）。
#     本地开发请用 sky-server-dev.yaml（地址为 127.0.0.1）。
#   - 敏感字段统一用 ${ENV_VAR:默认值} 占位符：真实密钥只存于 gitignored 的 .env，
#     由 docker-compose.yml 的 env_file 注入容器，Spring 启动时解析占位符。
#     因此本文件可安全提交，无需再做 <...> 手工屏蔽。
#   - Spring Boot 3.x 的 Redis 配置键为 spring.data.redis.*（非 2.x 的 spring.redis.*）。
#   - Docker 部署时 sky-server 需设 SPRING_PROFILES_ACTIVE=docker，
#     application.yml 通过 spring.config.import 从 Nacos 拉取本配置。
#   - 中文（如 shop.address）以 UTF-8 保存粘贴。
# ============================================================

spring:
  datasource:
    # 标准 JDBC URL（Spring Boot DataSource 自动配置需要此项）
    url: jdbc:mysql://host.docker.internal:3306/sky_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${SKY_DB_PASSWORD:123456}
    druid:
      # Druid 连接池专属配置（继承自 spring.datasource.*，只需覆盖池参数）
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
  data:
    redis:
      host: redis
      port: 6379
      password: ${SKY_REDIS_PASSWORD:123456}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    sentinel:
      transport:
        dashboard: sentinel:8858
        port: 8719
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-server-flow-rules.json
            groupId: DEFAULT_GROUP
            rule-type: flow
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:nacos:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            dataId: sky-server-degrade-rules.json
            groupId: DEFAULT_GROUP
            rule-type: degrade

# ============================================================
# RocketMQ 消息队列
# ============================================================
rocketmq:
  name-server: namesrv:9876
  producer:
    group: sky-server-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

# ============================================================
# Seata 分布式事务
# ============================================================
seata:
  enabled: true
  tx-service-group: sky-server-group
  service:
    vgroup-mapping:
      sky-server-group: default
    grouplist:
      default: seata:8091

# ============================================================
# 应用配置（密钥项通过环境变量注入）
# ============================================================
sky:
  jwt:
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:itcast}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET:itbast}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${SKY_ALIOSS_ENDPOINT:oss-cn-guangzhou.aliyuncs.com}
    access-key-id: ${SKY_ALIOSS_AK:PLACEHOLDER}
    access-key-secret: ${SKY_ALIOSS_SK:PLACEHOLDER}
    bucket-name: ${SKY_ALIOSS_BUCKET:nouxiaxia-sky-takeout}
  wechat:
    appid: ${SKY_WECHAT_APPID:wx6d0f01e4406a6a97}
    secret: ${SKY_WECHAT_SECRET:PLACEHOLDER}
  shop:
    address: ${SKY_SHOP_ADDRESS:桂林市灵川县灵田镇桂林电子科技大学花江校区}
  baidu:
    ak: ${SKY_BAIDU_AK:PLACEHOLDER}
