# Nacos 配置模板 —— sky-cart-service（本地开发）
# Data ID: sky-cart-service-dev.yaml
# Group: DEFAULT_GROUP
# 配置格式: YAML
#
# sky-cart-service (:8085) — 购物车
# 数据库: sky_cart_db  表: shopping_cart, undo_log
# 依赖: sky-menu-service（通过 OpenFeign 获取菜品/套餐信息）
# 中间件: Seata（作为 order-service 全局事务的购物车分支参与者）

# 性能优化：调大 Tomcat 线程池/连接参数（实测：默认200线程高并发吞吐下降明显，400线程 80并发提升约2.5倍）
server:
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500
    max-connections: 10000
    connection-timeout: 5000

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/sky_cart_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: ${SKY_DB_PASSWORD:123456}
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
        port: 8719
      eager: true

seata:
  enabled: true
  tx-service-group: sky-order-service-group
  service:
    vgroup-mapping:
      sky-order-service-group: default
    grouplist:
      default: 127.0.0.1:8091

logging:
  level:
    com.alibaba.cloud.sentinel.endpoint: WARN
