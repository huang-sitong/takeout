# ============================================================
# 苍穹外卖 — 基础设施 Docker Compose 编排
# ============================================================
# 启动: docker compose up -d
# 停止: docker compose down
# 状态: docker compose ps
# 日志: docker compose logs -f [service]
# ============================================================

services:
  # ============================================================
  # Redis 缓存服务
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: sky-redis
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass 123456
    volumes:
      - redis-data:/data
    networks:
      - sky-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================
  # Nacos 注册中心 + 配置中心
  # ============================================================
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: sky-nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "8849:8080"   # Nacos 3.x 控制台独立端口 (容器 8080 -> 主机 8849)
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=host.docker.internal
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_DB_NAME=nacos_config
      - MYSQL_SERVICE_USER=root
      - MYSQL_SERVICE_PASSWORD=123456
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=4j9ElV3zHF29hki317wi1iYwXdxUQXuPACqhzXJhHE8=
      - NACOS_AUTH_IDENTITY_KEY=nacos
      - NACOS_AUTH_IDENTITY_VALUE=nacos
      - JVM_XMS=256m
      - JVM_XMX=256m
      - JVM_XMN=128m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sky-net
    healthcheck:
      # 认证开启后 /v1/ns/* 未带 token 会返回 403，去掉 -f 让"服务器已响应"即视为存活（仅连接失败才判 unhealthy）
      test: ["CMD-SHELL", "curl -s -o /dev/null 'http://localhost:8848/nacos/v1/ns/service/list?pageNo=1&pageSize=1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ============================================================
  # Seata Server 分布式事务协调器
  # ============================================================
  seata:
    image: seataio/seata-server:2.5.0
    container_name: sky-seata
    restart: always
    ports:
      - "8091:8091"
    volumes:
      - ./docker/seata-server/application.yml:/seata-server/resources/application.yml:ro
      - ./docker/seata-server/jdbc:/lib/jdbc:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    networks:
      - sky-net
    healthcheck:
      # 只读方式建连探活（不写任何字节），避免 echo 的换行触发 Seata ProtocolDetectHandler 打 ERROR 刷屏
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/localhost/8091' 2>/dev/null && exit 0 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      nacos:
        condition: service_healthy

  # ============================================================
  # RocketMQ NameServer — 路由注册中心
  # ============================================================
  namesrv:
    image: apache/rocketmq:5.3.1
    container_name: sky-namesrv
    restart: always
    ports:
      - "9876:9876"
    command: sh mqnamesrv
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/localhost/9876' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ============================================================
  # RocketMQ Broker — 消息存储与投递
  # ============================================================
  broker:
    image: apache/rocketmq:5.3.1
    container_name: sky-broker
    restart: always
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      - NAMESRV_ADDR=namesrv:9876
    command: >
      sh mqbroker
      -n namesrv:9876
      autoCreateTopicEnable=true
      autoCreateSubscriptionGroup=true
    networks:
      - sky-net
    depends_on:
      namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '< /dev/tcp/localhost/10911' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ============================================================
  # RocketMQ Console — 管理控制台
  # ============================================================
  rmq-console:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: sky-rmq-console
    restart: always
    ports:
      - "8082:8080"
    environment:
      - NAMESRV_ADDR=namesrv:9876
    networks:
      - sky-net
    depends_on:
      - broker

  # ============================================================
  # Sentinel Dashboard 流量控制控制台
  # ============================================================
  sentinel:
    build:
      context: ./docker/sentinel-dashboard
      dockerfile: Dockerfile
    image: sky-sentinel-dashboard:1.8.9
    container_name: sky-sentinel
    restart: always
    ports:
      - "8858:8858"
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8858 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ============================================================
  # sky-admin-service 员工管理微服务
  # ============================================================
  sky-admin-service:
    build:
      context: ./sky-admin-service
      dockerfile: Dockerfile
    image: sky-admin-service:1.0-SNAPSHOT
    container_name: sky-admin-service
    restart: always
    ports:
      - "8092:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      nacos:
        condition: service_healthy

  # ============================================================
  # sky-user-service 用户管理 + 地址簿微服务
  # ============================================================
  sky-user-service:
    build:
      context: ./sky-user-service
      dockerfile: Dockerfile
    image: sky-user-service:1.0-SNAPSHOT
    container_name: sky-user-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      nacos:
        condition: service_healthy

  # ============================================================
  # sky-menu-service 菜品/套餐/分类 + OSS 上传微服务
  # ============================================================
  sky-menu-service:
    build:
      context: ./sky-menu-service
      dockerfile: Dockerfile
    image: sky-menu-service:1.0-SNAPSHOT
    container_name: sky-menu-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # sky-cart-service 购物车微服务
  # ============================================================
  sky-cart-service:
    build:
      context: ./sky-cart-service
      dockerfile: Dockerfile
    image: sky-cart-service:1.0-SNAPSHOT
    container_name: sky-cart-service
    restart: always
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      nacos:
        condition: service_healthy

  # ============================================================
  # sky-order-service 订单核心微服务（Seata + RocketMQ + Sentinel）
  # ============================================================
  sky-order-service:
    build:
      context: ./sky-order-service
      dockerfile: Dockerfile
    image: sky-order-service:1.0-SNAPSHOT
    container_name: sky-order-service
    restart: always
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      nacos:
        condition: service_healthy
      redis:
        condition: service_healthy
      seata:
        condition: service_healthy
      namesrv:
        condition: service_healthy

  # ============================================================
  # sky-gateway 网关服务
  # ============================================================
  sky-gateway:
    build:
      context: ./sky-gateway
      dockerfile: Dockerfile
    image: sky-gateway:1.0-SNAPSHOT
    container_name: sky-gateway
    restart: always
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - NACOS_SERVER_ADDR=nacos:8848
    env_file:
      - .env
    networks:
      - sky-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      nacos:
        condition: service_healthy

volumes:
  redis-data:

networks:
  sky-net:
    driver: bridge
